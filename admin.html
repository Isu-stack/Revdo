<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revdo Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--ink:#0e0e0c;--bone:#ede8df;--paper:#d9d2c2;--rust:#a8421c;--moss:#3d4a3a;--fog:#8f897d;--line:rgba(14,14,12,.14);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;min-height:100svh;background:var(--bone);color:var(--ink);font-family:var(--sans);line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit}.shell{width:min(100% - 32px,1180px);margin:0 auto;padding:32px 0 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:38px;height:38px}.brand h1{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1}.muted{color:#6b665c}.mono{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.panel{border:1px solid var(--line);border-radius:8px;background:rgba(237,232,223,.56);padding:22px}.login{max-width:430px;margin:12vh auto}.grid{display:grid;grid-template-columns:270px 1fr;gap:22px}.tabs{display:grid;gap:8px;align-self:start;position:sticky;top:24px}.tab{min-height:44px;padding:10px 14px;border-radius:8px;text-align:left;background:transparent;color:var(--ink)}.tab.active{background:var(--ink);color:var(--bone)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bone);font-weight:650}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#7a2311}.btn.rust{background:var(--rust)}label{display:grid;gap:8px;margin-bottom:16px;font-size:13px;font-weight:650}input,textarea{width:100%;min-height:44px;border:1px solid #777166;background:#f4efe6;border-radius:8px;padding:12px 13px;color:var(--ink)}textarea{min-height:116px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.55}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--rust);outline-offset:3px}.section-title{font-family:var(--serif);font-size:30px;font-weight:400;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.status{min-height:22px;margin-top:12px;color:#3d4a3a}.error{color:#8b2d13}.hidden{display:none!important}.item{border-top:1px solid var(--line);padding:18px 0}.item:first-child{border-top:0}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.item-head h3{font-family:var(--serif);font-size:24px;font-weight:400}.small{font-size:13px}.asset-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.preview{width:100%;aspect-ratio:3/1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#d7cfbe;margin-bottom:12px}.preview img{width:100%;height:100%;object-fit:cover;display:block}@media(max-width:900px){.grid{grid-template-columns:1fr}.tabs{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.panel{padding:18px}}@media(max-width:480px){.shell{width:min(100% - 24px,1180px);padding-top:20px}.tabs{grid-template-columns:1fr 1fr}.toolbar .btn{flex:1}.item-head{align-items:flex-start}}
    .nav-hint{margin:8px 0 16px;color:#6b665c;font-size:13px}.nav-item{border-top:1px solid var(--line);padding:14px 0}.nav-item:first-of-type{border-top:0}.nav-item strong{font-family:var(--serif);font-size:20px;font-weight:400}.nav-item label{margin:10px 0 0}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="brand"><img src="/assets/revdo-mark.svg" alt=""><div><h1>Revdo Admin</h1><p class="muted small">Update content, menu, pages and image assets.</p></div></div>
      <div class="toolbar"><a class="btn secondary" href="/" target="_blank" rel="noopener noreferrer">Open site</a><button class="btn danger hidden" id="logoutBtn">Logout</button></div>
    </div>

    <section class="panel login" id="loginPanel">
      <h2 class="section-title">Login</h2>
      <form id="loginForm">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn rust" type="submit">Login</button>
      </form>
      <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
    </section>

    <section class="grid hidden" id="adminPanel">
      <nav class="tabs" id="tabs"></nav>
      <div class="panel">
        <div class="toolbar">
          <button class="btn rust" id="saveBtn">Save changes</button>
          <button class="btn secondary" id="reloadBtn">Reload data</button>
          <button class="btn secondary" id="downloadBtn">Download JSON</button>
        </div>
        <div id="editor"></div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script>
    const $=(s,r=document)=>r.querySelector(s);const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));let site=null;let active="general";
    const tabs=[["general","General"],["hero","Hero"],["work","Work"],["services","Services"],["studio","Studio"],["contact","Contact"],["raw","Raw JSON"]];
    const schema={work:{title:"Work item",fields:["title","scope","description","image","alt"]},services:{title:"Service",fields:["title","description"]},process:{title:"Process",fields:["title","description"]},"studio.facts":{title:"Fact",fields:["value","label"]},"studio.principles":{title:"Principle",fields:["title","description"]},"footer.links":{title:"Footer link",fields:["label","href"]}};
    const get=(path)=>path.split(".").reduce((o,k)=>o?.[k],site);const set=(path,value)=>{const keys=path.split(".");let o=site;while(keys.length>1){const k=keys.shift();o[k]??={};o=o[k]}o[keys[0]]=value};
    function showLogin(on){$("#loginPanel").classList.toggle("hidden",!on);$("#adminPanel").classList.toggle("hidden",on);$("#logoutBtn").classList.toggle("hidden",on)}
    async function api(path,options={}){const res=await fetch(path,{headers:{"Content-Type":"application/json",Accept:"application/json",...(options.headers||{})},...options});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||"Request failed");return body}
    async function init(){renderTabs();try{const session=await api("/api/session");if(session.authenticated){showLogin(false);await load()}else showLogin(true)}catch(err){showLogin(true);$("#loginStatus").textContent=`Could not check the admin session. Reload this page and try again. ${err.message}`;$("#loginStatus").classList.add("error")}}
    function renderTabs(){$("#tabs").innerHTML=tabs.map(([id,label])=>`<button class="tab ${id===active?"active":""}" data-tab="${id}">${label}</button>`).join("");$("#tabs").onclick=e=>{const btn=e.target.closest("[data-tab]");if(!btn)return;active=btn.dataset.tab;renderTabs();renderEditor()}}
    async function load(){setStatus("Loading site data...");try{site=await api("/api/site");renderEditor();setStatus("Data loaded.");return true}catch(err){setStatus(`Could not load site data. Check the server, then select Reload data to try again. ${err.message}`,true);return false}}
    function renderEditor(){if(!site)return;const e=$("#editor");if(active==="general")e.innerHTML=general();if(active==="hero")e.innerHTML=hero();if(active==="work")e.innerHTML=listEditor("work");if(active==="services")e.innerHTML=services();if(active==="studio")e.innerHTML=studio();if(active==="contact")e.innerHTML=contact();if(active==="raw")e.innerHTML=raw();bindInputs(e)}
    function input(path,label,type="text"){return`<label>${label}<input data-path="${path}" type="${type}" value="${esc(get(path)||"")}"></label>`}
    function area(path,label){return`<label class="full">${label}<textarea data-path="${path}">${esc(get(path)||"")}</textarea></label>`}
    function general(){return`<h2 class="section-title">General</h2><div class="form-grid">${input("brand.name","Brand name")}${input("brand.logo","Logo path")}${input("seo.title","SEO title")}${input("seo.description","SEO description")}${area("sections.workIntro","Home work intro")}${area("sections.workTitle","Work page title")}${area("sections.serviceIntro","Home service intro")}${area("sections.serviceTitle","Services page title")}${area("sections.processTitle","Process title")}</div><h2 class="section-title">Menu</h2>${navEditor()}<h2 class="section-title">Footer links</h2>${listEditor("footer.links",true)}<h2 class="section-title">Logo upload</h2>${uploadBox("brand.logo","Current logo")}`}
    function navEditor(){return`<p class="nav-hint">These five page routes are fixed. Edit their labels here; the route names cannot be removed or changed.</p>${get("nav").map((item,index)=>`<div class="nav-item"><strong>${esc(item.label)}</strong><label>Menu label<input data-list-path="nav" data-index="${index}" data-field="label" value="${esc(item.label)}"></label><span class="small muted">Page: /#${esc(item.slug)}</span></div>`).join("")}`}
    function hero(){return`<h2 class="section-title">Hero</h2>${preview(get("hero.image"))}<div class="form-grid">${input("hero.eyebrow","Eyebrow")}${input("hero.image","Hero image path")}${area("hero.title","Title")}${area("hero.subtitle","Subtitle")}${input("hero.imageAlt","Image alt text")}</div>${uploadBox("hero.image","Replace hero image")}`}
    function services(){return`<h2 class="section-title">Services</h2>${listEditor("services",true)}<h2 class="section-title">Process</h2>${listEditor("process",true)}`}
    function studio(){return`<h2 class="section-title">Studio</h2><div class="form-grid">${input("studio.location","Location")}${area("studio.statement","Statement")}${area("studio.copy","Copy")}</div><h2 class="section-title">Facts</h2>${listEditor("studio.facts",true)}<h2 class="section-title">Principles</h2>${listEditor("studio.principles",true)}`}
    function contact(){return`<h2 class="section-title">Contact</h2><div class="form-grid">${input("contact.email","Email","email")}${area("contact.title","Title")}${area("contact.copy","Copy")}${input("footer.copyright","Copyright")}${input("footer.timezone","Timezone")}${input("footer.indexLabel","Index label")}${area("footer.description","Footer description")}</div>`}
    function raw(){return`<h2 class="section-title">Raw JSON</h2><p class="muted small" style="margin-bottom:12px">Use this for advanced edits. Invalid JSON cannot be saved.</p><textarea id="rawJson" style="min-height:620px">${esc(JSON.stringify(site,null,2))}</textarea>`}
    function listEditor(path,embedded=false){const items=get(path)||[];const cfg=schema[path];return`${embedded?"":`<h2 class="section-title">${esc(cfg.title)}</h2>`}<div data-list="${path}">${items.map((item,index)=>itemEditor(path,item,index,cfg)).join("")}</div><button class="btn secondary" data-add="${path}" type="button">Add ${esc(cfg.title)}</button>`}
    function itemEditor(path,item,index,cfg){return`<div class="item" data-index="${index}" data-list-item="${path}"><div class="item-head"><h3>${esc(item.title||item.label||item.value||`${cfg.title} ${index+1}`)}</h3><button class="btn secondary" data-remove="${path}:${index}" type="button">Remove</button></div>${cfg.fields.map(field=>field==="description"?`<label>${field}<textarea data-list-path="${path}" data-index="${index}" data-field="${field}">${esc(item[field]||"")}</textarea></label>`:`<label>${field}<input data-list-path="${path}" data-index="${index}" data-field="${field}" value="${esc(item[field]||"")}"></label>`).join("")}${item.image?preview(item.image):""}${cfg.fields.includes("image")?uploadBox(`${path}.${index}.image`,`Upload image for ${cfg.title} ${index+1}`):""}</div>`}
    function preview(src){return src?`<div class="preview"><img src="${esc(src)}" alt=""></div>`:""}
    function uploadBox(path,label){return`<div class="asset-row"><label>${label}<input type="file" data-upload="${path}" accept="image/webp,image/png,image/jpeg"></label><button class="btn secondary" data-upload-btn="${path}" type="button">Upload</button></div>`}
    function bindInputs(root){root.oninput=e=>{const p=e.target.dataset.path;if(p)set(p,e.target.value);const lp=e.target.dataset.listPath;if(lp){const list=get(lp);list[Number(e.target.dataset.index)][e.target.dataset.field]=e.target.value}};root.onclick=async e=>{const add=e.target.closest("[data-add]");if(add){const path=add.dataset.add;const cfg=schema[path];get(path).push(Object.fromEntries(cfg.fields.map(f=>[f,""])));renderEditor();return}const rem=e.target.closest("[data-remove]");if(rem){const [path,index]=rem.dataset.remove.split(":");get(path).splice(Number(index),1);renderEditor();return}const upload=e.target.closest("[data-upload-btn]");if(upload){await uploadAsset(upload.dataset.uploadBtn);return}}}
    async function uploadAsset(path){const input=document.querySelector(`[data-upload="${CSS.escape(path)}"]`);if(!input?.files?.[0]){setStatus("Choose a file first.",true);return}const body=new FormData();body.append("file",input.files[0]);const res=await fetch("/api/upload",{method:"POST",body});const data=await res.json().catch(()=>({}));if(!res.ok){setStatus(data.error||"Upload failed.",true);return}setNestedUploadPath(path,data.path);renderEditor();setStatus(`Uploaded: ${data.path}`)}
    function setNestedUploadPath(path,value){const parts=path.split(".");if(parts.length===3&&!Number.isNaN(Number(parts[1]))){get(parts[0])[Number(parts[1])][parts[2]]=value;return}set(path,value)}
    function setStatus(msg,error=false){const target=$("#status");if(target){target.textContent=msg;target.classList.toggle("error",error)}}
    $("#loginForm").onsubmit=async e=>{e.preventDefault();const form=Object.fromEntries(new FormData(e.currentTarget));try{await api("/api/login",{method:"POST",body:JSON.stringify(form)});showLogin(false);await load()}catch(err){$("#loginStatus").textContent=err.message;$("#loginStatus").classList.add("error")}};
    $("#saveBtn").onclick=async()=>{try{if(active==="raw")site=JSON.parse($("#rawJson").value);await api("/api/site",{method:"PUT",body:JSON.stringify(site)});setStatus("Saved. Public site updated.")}catch(err){setStatus(err.message,true)}};
    $("#reloadBtn").onclick=load;$("#logoutBtn").onclick=async()=>{await api("/api/logout",{method:"POST"}).catch(()=>{});showLogin(true)};$("#downloadBtn").onclick=()=>{const blob=new Blob([JSON.stringify(site,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="revdo-site.json";a.click();URL.revokeObjectURL(url)};
    init();
  </script>
</body>
</html>

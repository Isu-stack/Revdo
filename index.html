<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revdo Studios | Design and Software</title>
  <meta name="description" content="Revdo Studios is an independent design and software studio in Bandung, Indonesia. Identity, digital products, websites, custom software and technology systems built as one connected practice.">
  <meta name="theme-color" content="#0e0e0c">
  <link rel="icon" href="/assets/revdo-mark.svg" type="image/svg+xml">
  <style>
    :root{--ink:#0e0e0c;--bone:#ede8df;--paper:#d9d2c2;--rust:#a8421c;--moss:#3d4a3a;--fog:#8f897d;--line:rgba(14,14,12,.14);--radius:8px;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{min-height:100vh;background:var(--bone);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow-x:hidden}body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.04;background-image:radial-gradient(var(--ink) .7px,transparent .8px);background-size:11px 11px;mix-blend-mode:multiply}a{color:inherit;text-decoration:none}img,svg{display:block;max-width:100%}button,input,textarea{font:inherit}button{border:0;background:transparent;color:inherit;cursor:pointer}::selection{background:var(--rust);color:var(--bone)}
    .wrap{width:min(100% - 44px,1240px);margin:0 auto}.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}.skip{position:fixed;left:16px;top:16px;z-index:1000;transform:translateY(-150%);background:var(--ink);color:var(--bone);padding:10px 14px;border-radius:999px}.skip:focus{transform:none}
    .nav{position:fixed;inset:0 0 auto;z-index:900;padding:20px 0;transition:background .25s ease,border .25s ease}.nav.scrolled{background:rgba(237,232,223,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}.brand{display:inline-flex;align-items:center;gap:12px;font-family:var(--serif);font-size:19px;letter-spacing:.04em}.brand img{width:36px;height:36px}.nav-links{display:flex;align-items:center;justify-content:center;gap:28px}.nav-links a{font-size:14px;font-weight:520;opacity:.78;transition:opacity .2s ease,color .2s ease}.nav-links a:hover,.nav-links a.active{opacity:1;color:var(--rust)}.nav-actions{display:flex;justify-content:flex-end;align-items:center;gap:14px}.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:42px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--bone);font-size:14px;font-weight:620;transition:background .2s ease,transform .2s ease}.pill:hover{background:var(--rust);transform:translateY(-1px)}
    .hamb{display:none;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(237,232,223,.72);align-items:center;justify-content:center}.hamb span,.hamb span:before,.hamb span:after{content:"";display:block;width:18px;height:1.5px;background:var(--ink);transition:.2s ease}.hamb span:before{transform:translateY(-6px)}.hamb span:after{transform:translateY(4.5px)}body.menu-open .hamb span{background:transparent}body.menu-open .hamb span:before{transform:rotate(45deg)}body.menu-open .hamb span:after{transform:translateY(-1.5px) rotate(-45deg)}
    .drawer{position:fixed;inset:0;z-index:800;display:grid;grid-template-columns:1fr min(520px,100%);pointer-events:none}.drawer-scrim{background:rgba(14,14,12,.38);opacity:0;transition:opacity .25s ease}.drawer-panel{background:var(--ink);color:var(--bone);padding:96px 28px 28px;transform:translateX(100%);transition:transform .32s cubic-bezier(.16,1,.3,1);overflow-y:auto}body.menu-open .drawer{pointer-events:auto}body.menu-open .drawer-scrim{opacity:1}body.menu-open .drawer-panel{transform:none}.drawer-kicker{color:#8d8779;margin-bottom:28px}.drawer-links{display:grid;gap:4px;margin-bottom:34px}.drawer-links a{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid rgba(237,232,223,.14);font-family:var(--serif);font-size:clamp(30px,7vw,56px);line-height:1}.drawer-links a span{font-family:var(--mono);font-size:11px;color:var(--rust);letter-spacing:.14em}.drawer-small{display:grid;gap:12px;color:#aaa398;font-size:14px}
    main{min-height:100vh}.view{display:none;min-height:100vh;padding-top:96px}.view.active{display:block}.hero{min-height:calc(100vh - 96px);display:grid;align-items:end;padding:70px 0 42px}.hero-grid{display:grid;gap:42px}.hero-media{min-height:420px;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--paper)}.hero-media img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:saturate(.94) contrast(1.02)}.hero-media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,14,12,.58),rgba(14,14,12,.08))}.hero-copy{position:absolute;inset:auto 28px 28px;z-index:1;color:var(--bone);max-width:920px}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(58px,12vw,172px);line-height:.88;letter-spacing:-.02em}h1 em,.accent{color:var(--rust);font-style:italic}.lead{max-width:780px;font-size:clamp(18px,2vw,24px);color:var(--moss);font-weight:360;margin-top:24px}.hero-copy .lead{color:rgba(237,232,223,.86)}.meta-row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;color:var(--fog);padding-bottom:18px;border-bottom:1px solid var(--line)}
    .section{padding:104px 0}.section.dark{background:var(--ink);color:var(--bone)}.head{display:grid;grid-template-columns:minmax(160px,1fr) minmax(0,2fr);gap:40px;align-items:end;margin-bottom:52px}.label{display:flex;gap:12px;align-items:center;color:var(--fog)}.label:before{content:"";width:28px;height:1px;background:var(--rust)}h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,72px);line-height:1;letter-spacing:-.015em}.grid{display:grid;gap:24px}.work-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:rgba(237,232,223,.4)}.card-media{aspect-ratio:4/3;background:var(--paper);overflow:hidden}.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}.card:hover img{transform:scale(1.035)}.card-body{padding:20px}h3{font-family:var(--serif);font-size:clamp(26px,3vw,42px);font-weight:400;line-height:1.06;margin-bottom:10px}.muted{color:var(--fog)}.text{color:var(--moss);font-weight:360}
    .service-list,.process-list,.principles{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:86px 1fr 1.2fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--line);align-items:start}.dark .row{border-color:rgba(237,232,223,.14)}.dark .text,.dark .muted{color:#aaa398}.studio-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:70px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:42px}.fact{padding:22px;border:1px solid var(--line);border-radius:var(--radius)}.fact b{font-family:var(--serif);font-size:42px;font-weight:400;display:block}
    .contact-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:start}.contact-box{border:1px solid rgba(237,232,223,.16);border-radius:var(--radius);padding:28px}.contact-box a{color:var(--bone);border-bottom:1px solid rgba(237,232,223,.32)}form{display:grid;gap:18px}input,textarea{width:100%;border:1px solid rgba(237,232,223,.2);background:transparent;color:var(--bone);border-radius:var(--radius);padding:14px 15px;outline:none}textarea{min-height:148px;resize:vertical}input:focus,textarea:focus{border-color:var(--rust)}.submit{justify-self:start;border-radius:999px;background:var(--rust);color:var(--bone);padding:14px 22px;font-weight:650}
    footer{background:var(--ink);color:var(--bone);padding:70px 0 30px;border-top:1px solid rgba(237,232,223,.12)}.footer-word{font-family:var(--serif);font-size:clamp(52px,12vw,160px);line-height:.9;margin-bottom:52px}.footer-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:36px;padding-top:34px;border-top:1px solid rgba(237,232,223,.14)}.footer-grid h4{font-family:var(--mono);font-size:11px;color:#7d776d;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}.footer-grid p,.footer-grid a{color:#aaa398;font-size:14px}.footer-grid ul{list-style:none;display:grid;gap:9px}.footer-bottom{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:44px;color:#7d776d}.empty{padding:32px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--fog)}
    @media(max-width:980px){.nav-inner{grid-template-columns:1fr auto}.nav-links,.nav-actions .pill{display:none}.hamb{display:inline-flex}.hero-media{min-height:560px}.head,.studio-grid,.contact-grid{grid-template-columns:1fr}.work-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:56px 1fr}.row p{grid-column:2}.footer-grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.wrap{width:min(100% - 32px,1240px)}.view{padding-top:82px}.hero{min-height:calc(100vh - 82px);padding-top:34px}.hero-media{min-height:520px}.hero-copy{inset:auto 18px 22px}.work-grid,.facts,.footer-grid{grid-template-columns:1fr}.section{padding:78px 0}.drawer{grid-template-columns:1fr}.drawer-scrim{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <nav class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="#home" data-route><img id="brandLogo" src="/assets/revdo-mark.svg" alt="Revdo Studios logo"><span id="brandName">Revdo Studios</span></a>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-actions"><a class="pill" href="#contact" data-route>Start a project</a><button class="hamb" id="menuButton" aria-label="Open menu" aria-expanded="false"><span></span></button></div>
    </div>
  </nav>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-scrim" id="drawerClose" aria-label="Close menu"></button>
    <div class="drawer-panel"><div class="drawer-kicker mono">Revdo navigation</div><div class="drawer-links" id="drawerLinks"></div><div class="drawer-small" id="drawerInfo"></div></div>
  </aside>
  <main id="app">
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-work"></section>
    <section class="view" id="view-services"></section>
    <section class="view" id="view-studio"></section>
    <section class="view" id="view-contact"></section>
  </main>
  <footer><div class="wrap"><div class="footer-word" id="footerWord">Revdo Studios</div><div class="footer-grid" id="footerGrid"></div><div class="footer-bottom mono"><span id="copyright">© 2026 Revdo Studios</span><span id="timezone">Bandung UTC+7</span></div></div></footer>
  <script>
    const state={site:null,route:"home"};const fallbackImage="/assets/revdo-hero.webp";const $=(s,r=document)=>r.querySelector(s);const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const nl=(v="")=>esc(v).replace(/\n/g,"<br>");const arr=v=>Array.isArray(v)?v:[];
    async function loadSite(){try{const res=await fetch("/api/site",{headers:{Accept:"application/json"}});if(!res.ok)throw new Error("Cannot load site data");state.site=await res.json()}catch(e){$("#app").innerHTML='<section class="section"><div class="wrap empty">Site data failed to load. Run the project with <code>npm start</code>.</div></section>';throw e}render();route()}
    function render(){const s=state.site;document.title=s.seo?.title||"Revdo Studios";document.querySelector("meta[name='description']").setAttribute("content",s.seo?.description||"");$("#brandName").textContent=s.brand?.name||"Revdo Studios";$("#brandLogo").src=s.brand?.logo||"/assets/revdo-mark.svg";$("#footerWord").textContent=s.brand?.name||"Revdo Studios";$("#copyright").textContent=s.footer?.copyright||`© ${new Date().getFullYear()} ${s.brand?.name||"Revdo Studios"}`;$("#timezone").textContent=s.footer?.timezone||"Bandung UTC+7";renderNav();renderHome();renderWork();renderServices();renderStudio();renderContact();renderFooter()}
    function renderNav(){const nav=arr(state.site.nav);$("#navLinks").innerHTML=nav.map(i=>`<a href="#${esc(i.slug)}" data-route>${esc(i.label)}</a>`).join("");$("#drawerLinks").innerHTML=nav.map((i,idx)=>`<a href="#${esc(i.slug)}" data-route>${esc(i.label)} <span>${String(idx+1).padStart(2,"0")}</span></a>`).join("");$("#drawerInfo").innerHTML=`<span>${esc(state.site.contact?.email||"")}</span><span>${esc(state.site.studio?.location||"")}</span><a class="pill" href="#contact" data-route>Start a project</a>`}
    function renderHome(){const h=state.site.hero||{};const workPreview=arr(state.site.work).slice(0,4);$("#view-home").innerHTML=`<div class="hero"><div class="wrap hero-grid"><div class="meta-row mono"><span>${esc(h.eyebrow||"")}</span><span>${esc(state.site.studio?.location||"")}</span><span>${esc(state.site.footer?.indexLabel||"")}</span></div><div class="hero-media"><img src="${esc(h.image||fallbackImage)}" alt="${esc(h.imageAlt||"Revdo Studios workspace")}"><div class="hero-copy"><h1>${nl(h.title||"")}</h1><p class="lead">${esc(h.subtitle||"")}</p></div></div></div></div><section class="section"><div class="wrap head"><div class="label mono">Selected work</div><h2>${nl(state.site.sections?.workIntro||"Work shaped by the problem.")}</h2></div><div class="wrap grid work-grid">${cards(workPreview)}</div></section><section class="section dark"><div class="wrap head"><div class="label mono">Practice</div><h2>${nl(state.site.sections?.serviceIntro||"Identity, interface and engineering in one practice.")}</h2></div><div class="wrap service-list">${rows(state.site.services)}</div></section>`}
    function renderWork(){$("#view-work").innerHTML=`<section class="section"><div class="wrap head"><div class="label mono">Selected work</div><h2>${nl(state.site.sections?.workTitle||"")}</h2></div><div class="wrap grid work-grid">${cards(state.site.work)}</div></section>`}
    function renderServices(){$("#view-services").innerHTML=`<section class="section"><div class="wrap head"><div class="label mono">Services</div><h2>${nl(state.site.sections?.serviceTitle||"")}</h2></div><div class="wrap service-list">${rows(state.site.services)}</div></section><section class="section dark"><div class="wrap head"><div class="label mono">Process</div><h2>${nl(state.site.sections?.processTitle||"")}</h2></div><div class="wrap process-list">${rows(state.site.process)}</div></section>`}
    function renderStudio(){const studio=state.site.studio||{};$("#view-studio").innerHTML=`<section class="section"><div class="wrap studio-grid"><div><div class="label mono">Studio</div><h2 style="margin-top:28px">${nl(studio.statement||"")}</h2><p class="lead">${esc(studio.copy||"")}</p><div class="facts">${arr(studio.facts).map(f=>`<div class="fact"><b>${esc(f.value)}</b><span class="mono muted">${esc(f.label)}</span></div>`).join("")}</div></div><div class="principles">${rows(studio.principles)}</div></div></section>`}
    function renderContact(){const c=state.site.contact||{};$("#view-contact").innerHTML=`<section class="section dark"><div class="wrap contact-grid"><div><div class="label mono">Contact</div><h2 style="margin-top:28px">${nl(c.title||"")}</h2><p class="lead">${esc(c.copy||"")}</p></div><div class="contact-box"><h3>Start a project</h3><p class="text" style="margin-bottom:22px">Send a short brief. The form opens your email client with the message prepared.</p><form id="contactForm"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><textarea name="brief" placeholder="Brief"></textarea><button class="submit" type="submit">Send inquiry</button></form><p class="muted" style="margin-top:22px"><a href="mailto:${esc(c.email||"")}">${esc(c.email||"")}</a></p></div></div></section>`;$("#contactForm")?.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(e.currentTarget);const subject=encodeURIComponent(`Project inquiry from ${d.get("name")||""}`);const body=encodeURIComponent(`Name: ${d.get("name")||""}\nEmail: ${d.get("email")||""}\n\nBrief:\n${d.get("brief")||""}`);location.href=`mailto:${c.email}?subject=${subject}&body=${body}`})}
    function renderFooter(){const f=state.site.footer||{};$("#footerGrid").innerHTML=`<div><h4>${esc(state.site.brand?.name||"")}</h4><p>${esc(f.description||"")}</p></div><div><h4>Pages</h4><ul>${arr(state.site.nav).map(i=>`<li><a href="#${esc(i.slug)}" data-route>${esc(i.label)}</a></li>`).join("")}</ul></div><div><h4>Practice</h4><ul>${arr(state.site.services).slice(0,4).map(i=>`<li><a href="#services" data-route>${esc(i.title)}</a></li>`).join("")}</ul></div><div><h4>Connect</h4><ul>${arr(f.links).map(i=>`<li><a href="${esc(i.href)}">${esc(i.label)}</a></li>`).join("")}</ul></div>`}
    function cards(items){const list=arr(items);if(!list.length)return'<div class="empty">No work items yet.</div>';return list.map(i=>`<article class="card"><div class="card-media"><img src="${esc(i.image||fallbackImage)}" alt="${esc(i.alt||i.title||"")}"></div><div class="card-body"><p class="mono muted">${esc(i.scope||"")}</p><h3>${esc(i.title||"")}</h3><p class="text">${esc(i.description||"")}</p></div></article>`).join("")}
    function rows(items){const list=arr(items);if(!list.length)return'<div class="empty">No items yet.</div>';return list.map((i,idx)=>`<div class="row"><span class="mono muted">${String(idx+1).padStart(2,"0")}</span><h3>${esc(i.title||i.value||"")}</h3><p class="text">${esc(i.description||i.label||"")}</p></div>`).join("")}
    function route(){const slug=(location.hash||"#home").slice(1);const allowed=arr(state.site?.nav).some(i=>i.slug===slug)?slug:"home";state.route=allowed;document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===`view-${allowed}`));document.querySelectorAll("[data-route]").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===`#${allowed}`));closeMenu();window.scrollTo({top:0,behavior:"auto"})}
    function closeMenu(){document.body.classList.remove("menu-open");$("#menuButton").setAttribute("aria-expanded","false");$("#drawer").setAttribute("aria-hidden","true")}
    $("#menuButton").addEventListener("click",()=>{const open=!document.body.classList.contains("menu-open");document.body.classList.toggle("menu-open",open);$("#menuButton").setAttribute("aria-expanded",String(open));$("#drawer").setAttribute("aria-hidden",String(!open))});$("#drawerClose").addEventListener("click",closeMenu);window.addEventListener("hashchange",route);window.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});window.addEventListener("scroll",()=>$("#nav").classList.toggle("scrolled",scrollY>20),{passive:true});document.addEventListener("click",e=>{const link=e.target.closest("[data-route]");if(!link)return;const href=link.getAttribute("href");if(!href?.startsWith("#"))return;if((location.hash||"#home")===href)route()});loadSite();
  </script>
</body>
</html>
